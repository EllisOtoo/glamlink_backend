components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    RequestOtpDto:
      type: object
      properties: {}
    VerifyOtpDto:
      type: object
      properties: {}
    FirebaseLoginDto:
      type: object
      properties: {}
    FirebaseRegisterDto:
      type: object
      properties: {}
